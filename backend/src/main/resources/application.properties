spring.application.name=backend

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:raisetechsns}
spring.datasource.username=${POSTGRES_USER:raisetechsns}
spring.datasource.password=${POSTGRES_PASSWORD:raisetechsns}

# MyBatisのXMLマッパー（SQL定義）の置き場所
mybatis.mapper-locations=classpath:mapper/*.xml
# DBの列名（password_hashなど）をJavaのフィールド名（passwordHashなど）に自動変換する
mybatis.configuration.map-underscore-to-camel-case=true

# ログイン用JWTの署名鍵（HS256には32バイト以上必要）。本番相当の環境ではJWT_SECRET環境変数で必ず上書きすること
jwt.secret=${JWT_SECRET:dev-only-secret-key-do-not-use-in-production-env}
# アクセストークンの有効期限（ミリ秒）。デフォルトは1日
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
# JWTを載せるCookieのSecure属性。HTTPS配信になる本番相当の環境ではJWT_COOKIE_SECURE=trueにすること
jwt.cookie-secure=${JWT_COOKIE_SECURE:false}
