name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Checkstyle（静的解析）＋単体・結合テスト。結合テストはTestcontainersが使い捨てPostgreSQLを
  # 自動起動するため（AbstractIntegrationTest参照）、docker-compose.ymlのdbサービスは使わない。
  backend-test:
    name: Backend (Checkstyle + Test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: ./gradlew check
        working-directory: backend
        run: ./gradlew check

  # oxlint（静的解析）＋Vitest＋ビルド（tscの型チェックを含む）
  frontend-test:
    name: Frontend (Lint + Test + Build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm run test

      - name: Build
        working-directory: frontend
        run: npm run build

  # Playwright E2E（scenariosトラックのみ）。e2e/run.shと同じ前提（backend 8080・frontend 5173・
  # DB 5432・MinIO 9000）をCI上に再現する。パフォーマンス系（e2e/performance・perf-tests）は対象外。
  e2e-scenarios:
    name: E2E (Playwright scenarios)
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      # docker-compose.ymlのデフォルト値が application.properties のデフォルト値
      # （POSTGRES_*・AWS_S3_*）とポート・認証情報一致しているため、.envなしでそのまま使える
      - name: Start DB / MinIO
        run: docker compose up -d db minio minio-init

      - name: Wait for DB
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T db pg_isready -U raisetechsns -d raisetechsns > /dev/null 2>&1; then
              echo "db is ready"
              exit 0
            fi
            sleep 2
          done
          echo "db did not become ready in time" >&2
          exit 1

      - name: Start backend (background)
        working-directory: backend
        run: nohup ./gradlew bootRun > /tmp/backend.log 2>&1 &

      - name: Wait for backend
        run: |
          for i in $(seq 1 60); do
            if curl -sS -f http://localhost:8080/api/health > /dev/null 2>&1; then
              echo "backend is up"
              exit 0
            fi
            sleep 5
          done
          echo "backend did not become ready in time" >&2
          cat /tmp/backend.log
          exit 1

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Start frontend (background)
        working-directory: frontend
        run: nohup npm run dev > /tmp/frontend.log 2>&1 &

      - name: Wait for frontend
        run: |
          for i in $(seq 1 30); do
            if curl -sS -f -o /dev/null http://localhost:5173/ 2>&1; then
              echo "frontend is up"
              exit 0
            fi
            sleep 3
          done
          echo "frontend did not become ready in time" >&2
          cat /tmp/frontend.log
          exit 1

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E scenarios
        working-directory: e2e
        run: npx playwright test --project=scenarios

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
