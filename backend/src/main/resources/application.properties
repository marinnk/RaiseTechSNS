spring.application.name=backend

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:raisetechsns}
spring.datasource.username=${POSTGRES_USER:raisetechsns}
spring.datasource.password=${POSTGRES_PASSWORD:raisetechsns}

# MyBatisのXMLマッパー（SQL定義）の置き場所
mybatis.mapper-locations=classpath:mapper/*.xml
# DBの列名（password_hashなど）をJavaのフィールド名（passwordHashなど）に自動変換する
mybatis.configuration.map-underscore-to-camel-case=true

# ログイン用JWTの署名鍵（HS256には32バイト以上必要）。本番相当の環境ではJWT_SECRET環境変数で必ず上書きすること
jwt.secret=${JWT_SECRET:dev-only-secret-key-do-not-use-in-production-env}
# アクセストークンの有効期限（ミリ秒）。デフォルトは15分。期限切れ後は/api/auth/refreshで再発行する
jwt.access-token-expiration-ms=${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}
# リフレッシュトークンの有効期限（ミリ秒）。デフォルトは14日
jwt.refresh-token-expiration-ms=${JWT_REFRESH_TOKEN_EXPIRATION_MS:1209600000}
# JWT・リフレッシュトークンを載せるCookieのSecure属性。HTTPS配信になる本番相当の環境ではJWT_COOKIE_SECURE=trueにすること
jwt.cookie-secure=${JWT_COOKIE_SECURE:false}

# プロフィール画像アップロード用のmultipart設定。1ファイルあたり5MBまで（ImageValidationのバリデーションと合わせる）
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# アバター画像の保存先S3バケット。バケットの作成・IAM認証情報の発行は別途必要（README参照）。
# 認証情報はAWS SDKの標準認証情報チェーン（環境変数AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY等）に委ねる
app.s3.bucket=${AWS_S3_BUCKET:}
app.s3.region=${AWS_REGION:ap-northeast-1}
