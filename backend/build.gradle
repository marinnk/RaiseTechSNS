plugins {
	id 'java'
	id 'checkstyle'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
	// Swagger UI・OpenAPI定義（/v3/api-docs）に加え、静的なopenapi.yamlファイルの自動生成にも使う
	id 'org.springdoc.openapi-gradle-plugin' version '1.9.0'
}

group = 'com.raisetechsns'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-flyway'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:4.0.1'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
	runtimeOnly 'org.postgresql:postgresql'
	// プロフィール画像（アバター）をAmazon S3にアップロードするために使用する
	implementation platform('software.amazon.awssdk:bom:2.51.1')
	implementation 'software.amazon.awssdk:s3'
	// Swagger UI（実行時）とOpenAPI定義（/v3/api-docs）を自動生成する
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.security:spring-security-test'
	// テスト実行時だけ使い捨てのPostgreSQLコンテナを自動起動する（開発用DBには一切接続しない）。
	// spring-boot-testcontainersが引き込むorg.testcontainers:testcontainers本体のバージョンには
	// io.spring.dependency-managementプラグインの管理が効くが、junit-jupiter・postgresqlの
	// 個別モジュールには効かず解決できなかったため、本体と同じバージョンを明示している。
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter:2.0.5'
	testImplementation 'org.testcontainers:testcontainers-postgresql:2.0.5'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

// 静的なOpenAPI定義（YAML）を生成するタスクの設定。
// このプラグインは実際にアプリを一時的に起動し（forkedSpringBootRun）、起動中の
// /v3/api-docs.yaml エンドポイントにアクセスしてファイルに書き出す方式のため、
// 実行前にPostgreSQL（`docker compose up -d`）が起動している必要がある。
// 通常のbootRun（8080固定）と衝突しないよう、生成専用に8081を割り当てる。
// build/check/testには依存させていないため、`./gradlew generateOpenApiDocs`で個別に実行すること
openApi {
	apiDocsUrl = "http://localhost:8081/v3/api-docs.yaml"
	outputDir = file("$rootDir/../docs")
	outputFileName = "openapi.yaml"
	waitTimeInSeconds = 30
	customBootRun {
		args = ["--server.port=8081"]
	}
}

checkstyle {
	toolVersion = '10.21.1'
	configFile = file('config/checkstyle/checkstyle.xml')
	maxWarnings = 0
}
